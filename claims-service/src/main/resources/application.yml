server:
  port: 8080

spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5433/claims_db
    username: claims
    password: claims
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/seed holds local demo data only; drop it from this list for a real environment.
    locations: classpath:db/migration,classpath:db/seed
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # wait for the broker to confirm the write before an outbox row is marked published
      acks: all
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  servlet:
    multipart:
      # the 10 MB document limit is enforced in DocumentService; this only stops absurd uploads early
      max-file-size: 11MB
      max-request-size: 12MB

claims:
  jwt:
    # Shared signing key, verified by every service. Dev default only: set CLAIMS_JWT_SECRET anywhere real.
    secret: ${CLAIMS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 8h
  documents:
    dir: ./data/documents
  outbox:
    poll-interval: 1s
    send-timeout: 12s
