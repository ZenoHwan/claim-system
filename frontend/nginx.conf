server {
    listen 80;
    root /usr/share/nginx/html;

    # document uploads are capped at 10 MB by claims-service; allow a little over so its own error is the one returned
    client_max_body_size 12m;

    # Look the services up through Docker's DNS on each request (cached 10 s) instead of once at start-up,
    # so a restarted or rescaled container with a new address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $claims http://claims-service:8080;
    set $reporting http://reporting-service:8081;
    set $notification http://notification-service:8082;

    location /api/reports {
        proxy_pass $reporting;
    }

    # server-sent events: never buffer, and keep the connection open
    location /api/notifications/stream {
        proxy_pass $notification;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/notifications {
        proxy_pass $notification;
    }

    location /api {
        proxy_pass $claims;
    }

    # every bundle name carries a content hash, so a changed file is a new URL: browsers may keep these for a year
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # client-side routes (/login, /admin/queue, ...) all load the app shell;
    # the shell is revalidated on every load so a new deploy shows up at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
