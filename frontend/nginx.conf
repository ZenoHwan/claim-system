server {
    listen 80;
    root /usr/share/nginx/html;

    # document uploads are capped at 10 MB by claims-service; allow a little over so its own error is the one returned
    client_max_body_size 12m;

    location /api/reports {
        proxy_pass http://reporting-service:8081;
    }

    # server-sent events: never buffer, and keep the connection open
    location /api/notifications/stream {
        proxy_pass http://notification-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/notifications {
        proxy_pass http://notification-service:8082;
    }

    location /api {
        proxy_pass http://claims-service:8080;
    }

    # client-side routes (/login, /admin/queue, ...) all load the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
